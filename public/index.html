<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAgent AI | Deep Space</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body { background: #030308; color: #e3e3e3; display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

    #spaceCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

    /* SIDEBAR */
    .sidebar {
      width: 280px; background: rgba(8, 9, 16, 0.7); backdrop-filter: blur(25px);
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px;
      border-right: 1px solid rgba(168, 85, 247, 0.2); box-shadow: 5px 0 30px rgba(0, 0, 0, 0.7); z-index: 10;
    }
    .sidebar-top { display: flex; flex-direction: column; gap: 20px; }
    .brand {
      display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px;
      background: linear-gradient(135deg, #c084fc, #6366f1, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-icon { width: 30px; height: 30px; filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.8)); }

    .new-chat-btn {
      display: flex; align-items: center; gap: 12px; background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.4); color: #f1f5f9; padding: 12px 18px; border-radius: 30px;
      cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s ease;
    }
    .new-chat-btn:hover { background: rgba(168, 85, 247, 0.35); border-color: rgba(192, 132, 252, 0.8); }

    .nav-title { font-size: 11px; color: #64748b; padding: 12px 8px 4px 8px; font-weight: 700; text-transform: uppercase; }
    .chat-history { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 380px; }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px;
      border-radius: 10px; font-size: 13.5px; color: #94a3b8; cursor: pointer; transition: all 0.2s ease;
    }
    .chat-item:hover { background: rgba(255, 255, 255, 0.08); color: #f1f5f9; }
    .chat-item.active { border: 1px solid rgba(168, 85, 247, 0.5); background: rgba(139, 92, 246, 0.25); color: #fff; }
    .chat-title-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }

    .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 14px; }
    .bottom-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: #94a3b8; cursor: pointer; font-size: 14px; }
    .bottom-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }

    .user-card { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-info { display: flex; flex-direction: column; overflow: hidden; }
    .user-name { font-size: 14px; font-weight: 600; color: #fff; }
    .user-email { font-size: 11px; color: #64748b; }

    /* MAIN CHAT AREA */
    .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 12%; position: relative; z-index: 5; }
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-bottom: 20px; }

    .welcome-header { text-align: center; margin-top: 40px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .welcome-logo { width: 80px; height: 80px; filter: drop-shadow(0 0 30px rgba(192, 132, 252, 0.9)); animation: cosmicPulse 4s infinite ease-in-out; }
    @keyframes cosmicPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.7)); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 45px rgba(56, 189, 248, 0.9)); } }
    .welcome-header h1 { font-size: 40px; font-weight: 800; background: linear-gradient(135deg, #ffffff, #c084fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .welcome-header p { color: #94a3b8; font-size: 16px; }

    /* MESSAGES */
    .message { max-width: 85%; padding: 16px 22px; border-radius: 20px; line-height: 1.6; font-size: 15px; word-break: break-word; }
    .user { align-self: flex-end; background: linear-gradient(135deg, rgba(79, 70, 229, 0.85), rgba(124, 58, 237, 0.85)); color: #f8fafc; border-bottom-right-radius: 4px; border: 1px solid rgba(168, 85, 247, 0.4); }
    .model { align-self: flex-start; background: rgba(12, 14, 24, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); color: #e2e8f0; border-bottom-left-radius: 4px; backdrop-filter: blur(20px); }

    .thinking-box { background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #c084fc; }
    .thinking-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
    .thinking-content { margin-top: 8px; font-family: monospace; font-size: 12px; color: #94a3b8; white-space: pre-wrap; display: none; }

    .message pre { background: #1a1b26 !important; border-radius: 10px; padding: 14px; margin: 10px 0; position: relative; border: 1px solid rgba(255, 255, 255, 0.1); }
    .message img { max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid rgba(255, 255, 255, 0.15); }

    /* INPUT CONTAINER & FLOATING POPUPS */
    .input-wrapper { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 100; }
    
    .attachment-preview { display: none; align-items: center; gap: 10px; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.4); padding: 8px 16px; border-radius: 20px; font-size: 13px; color: #c084fc; width: fit-content; }
    .attachment-preview img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }

    .input-container { 
      background: rgba(10, 12, 22, 0.85); backdrop-filter: blur(25px); border-radius: 30px; 
      display: flex; align-items: center; gap: 6px; padding: 6px 12px; 
      border: 1px solid rgba(168, 85, 247, 0.4); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    .input-container input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; padding: 8px 4px; }
    
    .tool-btn {
      background: rgba(255, 255, 255, 0.08); border: none; color: #f1f5f9; border-radius: 50%; width: 38px; height: 38px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; flex-shrink: 0;
    }
    .tool-btn:hover { background: rgba(168, 85, 247, 0.35); color: #c084fc; }

    /* FLOATING POPUPS */
    .tools-popover {
      display: none; position: absolute; bottom: 75px; left: 0; background: rgba(18, 20, 30, 0.95);
      backdrop-filter: blur(25px); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 18px;
      padding: 10px; width: 220px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 9999;
    }
    .popover-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: #e2e8f0; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .popover-item:hover { background: rgba(168, 85, 247, 0.25); color: #fff; }

    .thinking-selector { display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #c084fc; cursor: pointer; position: relative; flex-shrink: 0; }
    .thinking-dropdown { display: none; position: absolute; bottom: 75px; right: 80px; background: rgba(18, 20, 30, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 14px; padding: 8px; width: 200px; z-index: 9999; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
    .thinking-option { padding: 10px 14px; border-radius: 10px; font-size: 13px; color: #e2e8f0; cursor: pointer; transition: background 0.2s; }
    .thinking-option:hover { background: rgba(168, 85, 247, 0.25); color: #fff; }

    .send-btn { background: linear-gradient(135deg, #c084fc, #6366f1); border: none; color: white; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  </style>
</head>
<body ondragover="event.preventDefault()" ondrop="handleDrop(event)">

  <canvas id="spaceCanvas"></canvas>

  <svg style="display: none;">
    <defs>
      <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#c084fc" />
        <stop offset="50%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#38bdf8" />
      </linearGradient>
    </defs>
  </svg>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 100 100">
          <path d="M50 0 C50 30 70 50 100 50 C70 50 50 70 50 100 C50 70 30 50 0 50 C30 50 50 30 50 0 Z" fill="url(#omniGrad)" />
          <circle cx="50" cy="50" r="10" fill="#ffffff" opacity="0.95" />
        </svg>
        OmniAgent
      </div>
      
      <button class="new-chat-btn" onclick="startNewChat()">+ New chat</button>
      
      <div class="nav-title">Recent Chats</div>
      <div class="chat-history" id="chatHistory"></div>
    </div>

    <div class="sidebar-bottom">
      <div class="bottom-btn" onclick="alert('OmniAgent Settings Operational')">⚙️ Settings</div>
      <div class="bottom-btn" onclick="alert('Help & Support Active')">❓ Help & Support</div>
      
      <div class="user-card">
        <div class="avatar">M</div>
        <div class="user-info">
          <div class="user-name">Musharib</div>
          <div class="user-email">musharib@omniagent.ai</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CHAT AREA -->
  <div class="main">
    <div class="chat-container" id="chat">
      <div class="welcome-header">
        <svg class="welcome-logo" viewBox="0 0 100 100">
          <path d="M50 0 C50 30 70 50 100 50 C70 50 50 70 50 100 C50 70 30 50 0 50 C30 50 50 30 50 0 Z" fill="url(#omniGrad)" />
          <circle cx="50" cy="50" r="12" fill="#ffffff" opacity="0.95" />
        </svg>
        <h1>Welcome to OmniAgent</h1>
        <p>Your supercharged AI assistant navigating space & time</p>
      </div>
    </div>

    <div class="input-wrapper">
      <!-- FLOATING POPUPS -->
      <div class="tools-popover" id="toolsPopover">
        <div class="popover-item" onclick="triggerFileUpload()">📤 Upload Image/File</div>
        <div class="popover-item" onclick="selectTool('image')">🖼️ Generate AI Artwork</div>
      </div>

      <div class="thinking-dropdown" id="thinkingDropdown">
        <div class="thinking-option" onclick="setThinkingMode('thinking')">🧠 Thinking (Gemini 2.0)</div>
        <div class="thinking-option" onclick="setThinkingMode('flash')">⚡ Fast Mode (Flash)</div>
      </div>

      <!-- ATTACHMENT PREVIEW -->
      <div class="attachment-preview" id="attachPreview">
        <img id="previewImg" src="" style="display:none;" />
        📎 <span id="attachFileName">Screenshot.png</span> 
        <span style="cursor:pointer; margin-left:8px; font-weight:bold; color:#ef4444;" onclick="clearFile()">✕</span>
      </div>

      <!-- INPUT BAR -->
      <div class="input-container">
        <button class="tool-btn" onclick="toggleToolsPopover(event)" title="Tools Menu">+</button>
        <button class="tool-btn" onclick="triggerFileUpload()" title="Attach File/Image">📎</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelect(event)">

        <input type="text" id="userInput" placeholder="Ask anything, paste screenshots (Ctrl+V), or attach files..." onkeydown="if(event.key==='Enter') sendMessage()" />
        
        <div class="thinking-selector" onclick="toggleThinkingDropdown(event)">
          <span id="thinkingLabel">Thinking 🧠</span> ▾
        </div>

        <button class="tool-btn" id="micBtn" onclick="toggleVoice()" title="Click to Speak">🎙️</button>

        <button class="send-btn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. ANIMATED CANVAS ENGINE
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 300 }, () => ({
      x: Math.random() * width, y: Math.random() * height,
      radius: Math.random() * 1.5 + 0.5,
      color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#c084fc' : '#38bdf8'),
      alpha: Math.random(), speed: Math.random() * 0.15 + 0.02, twinkle: Math.random() * 0.02 + 0.005
    }));

    let angle = 0;
    function drawMilkyWay() {
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.rotate(angle * 0.0002);

      const grad1 = ctx.createRadialGradient(-width*0.2, -height*0.2, 50, -width*0.2, -height*0.2, width * 0.6);
      grad1.addColorStop(0, 'rgba(147, 51, 234, 0.15)');
      grad1.addColorStop(0.5, 'rgba(79, 70, 229, 0.08)');
      grad1.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad1; ctx.fillRect(-width, -height, width * 2, height * 2);

      const grad2 = ctx.createRadialGradient(width*0.25, height*0.15, 30, width*0.25, height*0.15, width * 0.5);
      grad2.addColorStop(0, 'rgba(56, 189, 248, 0.12)');
      grad2.addColorStop(0.6, 'rgba(192, 132, 252, 0.05)');
      grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad2; ctx.fillRect(-width, -height, width * 2, height * 2);

      ctx.restore(); angle += 1;
    }

    function animateSpace() {
      ctx.fillStyle = '#030308'; ctx.fillRect(0, 0, width, height);
      drawMilkyWay();
      stars.forEach(star => {
        star.y -= star.speed;
        if (star.y < 0) { star.y = height; star.x = Math.random() * width; }
        star.alpha += star.twinkle;
        if (star.alpha > 1 || star.alpha < 0.2) star.twinkle = -star.twinkle;
        ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color; ctx.globalAlpha = Math.abs(star.alpha);
        ctx.fill(); ctx.globalAlpha = 1;
      });
      requestAnimationFrame(animateSpace);
    }
    animateSpace();

    // 2. STATE & STORAGE
    let sessions = JSON.parse(localStorage.getItem('omni_sessions') || '{}');
    let currentSessionId = localStorage.getItem('omni_current_session');
    let activeTool = null;
    let selectedThinkingMode = 'thinking';
    let base64Image = null;
    let isListening = false;
    let speechRecognizer = null;

    if (!currentSessionId || !sessions[currentSessionId]) createNewSession();
    else { renderSidebar(); loadSession(currentSessionId); }

    function createNewSession() {
      const id = 'session_' + Date.now();
      sessions[id] = { title: 'New Conversation', messages: [] };
      currentSessionId = id; saveSessions(); renderSidebar(); loadSession(id);
    }
    function saveSessions() {
      localStorage.setItem('omni_sessions', JSON.stringify(sessions));
      localStorage.setItem('omni_current_session', currentSessionId);
    }
    function renderSidebar() {
      const historyEl = document.getElementById('chatHistory'); historyEl.innerHTML = '';
      Object.keys(sessions).reverse().forEach(id => {
        const item = document.createElement('div');
        item.className = `chat-item ${id === currentSessionId ? 'active' : ''}`;
        item.onclick = () => loadSession(id);
        item.innerHTML = `<span class="chat-title-text">💬 ${sessions[id].title}</span><span onclick="event.stopPropagation(); deleteSession('${id}')">✕</span>`;
        historyEl.appendChild(item);
      });
    }
    function loadSession(id) {
      currentSessionId = id; saveSessions(); renderSidebar();
      const chat = document.getElementById('chat');
      const currentMessages = sessions[id].messages;
      if (currentMessages.length === 0) {
        chat.innerHTML = `<div class="welcome-header">
          <svg class="welcome-logo" viewBox="0 0 100 100"><path d="M50 0 C50 30 70 50 100 50 C70 50 50 70 50 100 C50 70 30 50 0 50 C30 50 50 30 50 0 Z" fill="url(#omniGrad)" /><circle cx="50" cy="50" r="12" fill="#ffffff" opacity="0.95" /></svg>
          <h1>Welcome to OmniAgent</h1><p>Your supercharged AI assistant navigating space & time</p>
        </div>`;
      } else {
        chat.innerHTML = '';
        currentMessages.forEach(msg => renderMessageUI(msg.role, msg.text, msg.thinking));
      }
    }
    function startNewChat() { createNewSession(); }
    function deleteSession(id) {
      delete sessions[id];
      if (Object.keys(sessions).length === 0) createNewSession();
      else { currentSessionId = Object.keys(sessions)[0]; saveSessions(); renderSidebar(); loadSession(currentSessionId); }
    }

    // 3. UI CONTROLS & POPUPS
    function toggleToolsPopover(e) {
      e.stopPropagation();
      document.getElementById('thinkingDropdown').style.display = 'none';
      const pop = document.getElementById('toolsPopover');
      pop.style.display = pop.style.display === 'block' ? 'none' : 'block';
    }
    function toggleThinkingDropdown(e) {
      e.stopPropagation();
      document.getElementById('toolsPopover').style.display = 'none';
      const drop = document.getElementById('thinkingDropdown');
      drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
    }
    document.addEventListener('click', () => {
      document.getElementById('toolsPopover').style.display = 'none';
      document.getElementById('thinkingDropdown').style.display = 'none';
    });

    function setThinkingMode(mode) {
      selectedThinkingMode = mode;
      document.getElementById('thinkingLabel').innerText = mode === 'thinking' ? 'Thinking 🧠' : 'Fast ⚡';
      document.getElementById('thinkingDropdown').style.display = 'none';
    }

    function selectTool(tool) {
      activeTool = tool;
      document.getElementById('toolsPopover').style.display = 'none';
      const input = document.getElementById('userInput');
      input.value = `Create ${tool}: `;
      input.focus();
    }

    // 4. IMAGE ATTACHMENT, DRAG & DROP, AND CTRL+V CLIPBOARD PASTE
    function triggerFileUpload() {
      document.getElementById('toolsPopover').style.display = 'none';
      document.getElementById('fileInput').click();
    }

    function processFile(file) {
      if (!file) return;
      document.getElementById('attachFileName').innerText = file.name || 'Pasted_Screenshot.png';
      document.getElementById('attachPreview').style.display = 'flex';

      const reader = new FileReader();
      reader.onload = function(evt) {
        base64Image = evt.target.result;
        if (file.type.startsWith('image/')) {
          const img = document.getElementById('previewImg');
          img.src = base64Image; img.style.display = 'inline-block';
        }
      };
      reader.readAsDataURL(file);
    }

    function handleFileSelect(e) { processFile(e.target.files[0]); }
    function handleDrop(e) {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        processFile(e.dataTransfer.files[0]);
      }
    }

    // GLOBAL CTRL+V PASTE LISTENER FOR SCREENSHOTS
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          if (blob) {
            processFile(blob);
            e.preventDefault();
            break;
          }
        }
      }
    });

    function clearFile() {
      base64Image = null;
      document.getElementById('attachPreview').style.display = 'none';
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('fileInput').value = '';
    }

    // 5. LIVE VOICE-TO-TEXT MICROPHONE ENGINE
    function toggleVoice() {
      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('userInput');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech Recognition is not supported by your browser. Please use Microsoft Edge or Chrome.");
        return;
      }

      if (!isListening) {
        speechRecognizer = new SpeechRecognition();
        speechRecognizer.continuous = false;
        speechRecognizer.interimResults = true;

        speechRecognizer.onstart = () => {
          isListening = true;
          micBtn.style.background = 'rgba(239, 68, 68, 0.3)';
          micBtn.style.color = '#ef4444';
          micBtn.style.boxShadow = '0 0 12px rgba(239, 68, 68, 0.8)';
        };

        speechRecognizer.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          input.value = transcript;
        };

        speechRecognizer.onerror = (e) => {
          console.error("Speech Recognition Error:", e);
          stopVoice();
        };

        speechRecognizer.onend = () => { stopVoice(); };
        speechRecognizer.start();
      } else {
        stopVoice();
      }
    }

    function stopVoice() {
      isListening = false;
      const micBtn = document.getElementById('micBtn');
      micBtn.style.background = 'rgba(255, 255, 255, 0.08)';
      micBtn.style.color = '#f1f5f9';
      micBtn.style.boxShadow = 'none';
      if (speechRecognizer) { speechRecognizer.stop(); speechRecognizer = null; }
    }

    // 6. RENDER MESSAGE & SEND LOGIC
    function renderMessageUI(role, htmlContent, thinkingContent = null) {
      const chat = document.getElementById('chat');
      const tempId = 'msg_' + Date.now();
      
      let thinkingHtml = '';
      if (thinkingContent) {
        thinkingHtml = `
          <div class="thinking-box">
            <div class="thinking-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
              🧠 Thinking Process ▼
            </div>
            <div class="thinking-content">${thinkingContent.replace(/\n/g, '<br>')}</div>
          </div>`;
      }

      chat.insertAdjacentHTML('beforeend', `
        <div id="${tempId}" class="message ${role}">
          ${thinkingHtml}
          <div class="content-body">${htmlContent}</div>
        </div>
      `);
      chat.scrollTop = chat.scrollHeight;

      document.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      let text = input.value.trim();
      if (!text && !base64Image) return;

      const chat = document.getElementById('chat');
      const header = document.querySelector('.welcome-header');
      if (header) header.style.display = 'none';

      let userHtml = text;
      if (base64Image) userHtml += `<br><img src="${base64Image}" style="max-height:180px; margin-top:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.2);"/>`;
      
      renderMessageUI('user', userHtml);
      sessions[currentSessionId].messages.push({ role: 'user', text: userHtml });
      
      if (sessions[currentSessionId].messages.length === 1 && text) {
        sessions[currentSessionId].title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
      }
      saveSessions(); renderSidebar();

      input.value = '';
      const payloadImage = base64Image;
      const currentTool = activeTool;
      clearFile();
      activeTool = null;

      const tempId = 'msg_' + Date.now();
      chat.insertAdjacentHTML('beforeend', `
        <div id="${tempId}" class="message model">
          <div class="thinking-box">⚙️ OmniAgent Neural Core Processing...</div>
          <div class="content-body">...</div>
        </div>
      `);
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch('http://localhost:3000/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: text, 
            image: payloadImage,
            toolMode: currentTool,
            thinkingMode: selectedThinkingMode
          })
        });

        const data = await response.json();
        const msgDiv = document.getElementById(tempId);
        
        const parsedReply = marked.parse(data.reply || "⚠️ No output generated.");
        msgDiv.querySelector('.content-body').innerHTML = parsedReply;

        if (data.thinking) {
          msgDiv.querySelector('.thinking-box').innerHTML = `
            <div class="thinking-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">
              🧠 Thinking Process ▼
            </div>
            <div class="thinking-content">${data.thinking.replace(/\n/g, '<br>')}</div>
          `;
        } else {
          msgDiv.querySelector('.thinking-box').style.display = 'none';
        }

        sessions[currentSessionId].messages.push({ role: 'model', text: parsedReply, thinking: data.thinking });
        saveSessions();
        chat.scrollTop = chat.scrollHeight;

        msgDiv.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }
  </script>
</body>
</html>
