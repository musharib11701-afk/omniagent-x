<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #131314; color: #e3e3e3; display: flex; height: 100vh; }
    .sidebar { width: 60px; background: #1e1f20; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
    .main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 15%; }
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
    .user { align-self: flex-end; background: #282a2c; color: #fff; border-bottom-right-radius: 2px; }
    .model { align-self: flex-start; background: transparent; color: #e3e3e3; }
    .input-container { background: #1e1f20; border-radius: 28px; display: flex; align-items: center; padding: 10px 20px; }
    .input-container input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 16px; }
    .input-container button { background: #4285f4; border: none; color: white; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div>✨</div>
  </div>
  <div class="main">
    <div class="chat-container" id="chat"></div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">↑</button>
    </div>
  </div>
  <script>
    const userId = 'user_3HOhfF4lmFJeTJG3kzvbuxM6rOD';

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const message = input.value.trim();
      if (!message) return;

      chat.innerHTML += `<div class="message user">${message}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, message })
        });
        const data = await res.json();
        chat.innerHTML += `<div class="message model">${data.reply || 'Error getting response'}</div>`;
      } catch (err) {
        chat.innerHTML += `<div class="message model">Connection error</div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
